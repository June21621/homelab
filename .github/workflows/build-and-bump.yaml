# 앱 repo들이 호출하는 재사용 워크플로: 이미지 빌드 → GHCR → 빌드 증명서 → homelab에 태그 PR
#
# 호출 예 (앱 repo의 .github/workflows/ci.yaml):
#   build:
#     needs: test
#     permissions: {contents: read, packages: write, id-token: write, attestations: write}
#     uses: June21621/homelab/.github/workflows/build-and-bump.yaml@main
#     with: {app: portfolio, image: ghcr.io/june21621/portfolio}
#     secrets: inherit
#
# 재사용 워크플로 안의 github.* 는 호출한 앱 repo의 값이다(github.sha = 앱 커밋).
# 빌드 증명서의 서명 워크플로는 이 파일이 되므로, 태그 PR 검사는
# "이 워크플로로 앱 repo main에서 빌드된 이미지인가"를 확인할 수 있다.
name: build-and-bump

on:
  workflow_call:
    inputs:
      app:
        description: gitops/apps 아래 앱 폴더 이름
        type: string
        required: true
      image:
        description: 이미지 이름 (소문자, 태그 없이). 예 ghcr.io/june21621/portfolio
        type: string
        required: true
    secrets:
      TAG_BUMP_APP_CLIENT_ID:
        required: false # main 빌드의 bump job에서만 쓴다
      TAG_BUMP_APP_PRIVATE_KEY:
        required: false
    outputs:
      digest:
        description: push한 이미지 다이제스트 (main이 아니면 빈 값)
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

# 기본 셸은 bash -e라 파이프 앞쪽 실패를 놓친다. 명시하면 bash -eo pipefail
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # GHCR push
      id-token: write # 빌드 증명서 서명(Sigstore OIDC)
      attestations: write # 증명서 저장
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: env.IS_MAIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main이 아니면(PR 등) 빌드만 해서 Dockerfile이 깨지지 않았는지 확인하고 push는 안 한다
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.IS_MAIN == 'true' }}
          tags: ${{ inputs.image }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

      - if: env.IS_MAIN == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # 앱 repo의 GITHUB_TOKEN은 homelab에 쓸 수 없고, 그 토큰으로 연 PR은 다른 워크플로도
  # 깨우지 못한다. 그래서 homelab에만 설치한 GitHub App의 단기 토큰으로 PR을 연다.
  bump:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    # 같은 앱의 bump는 하나씩. 늦게 끝난 옛 빌드가 새 PR을 닫고 되돌리는 경쟁을 줄인다
    concurrency:
      group: bump-${{ inputs.app }}
      cancel-in-progress: false
    env:
      APP: ${{ inputs.app }}
      IMAGE: ${{ inputs.image }}
      SHA: ${{ github.sha }}
      DIGEST: ${{ needs.build.outputs.digest }}
      SOURCE_REPO: ${{ github.repository }}
      HOMELAB: June21621/homelab
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.TAG_BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAG_BUMP_APP_PRIVATE_KEY }}
          owner: June21621
          repositories: homelab
          permission-contents: write
          permission-pull-requests: write

      # 스크립트도 homelab main의 것을 쓴다. 앱 repo는 태그를 바꾸는 방법을 정할 수 없다
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: June21621/homelab
          ref: main
          token: ${{ steps.token.outputs.token }}

      # 앱 repo main이 그 사이 앞서 나갔으면 이 빌드는 배포하지 않는다(새 커밋의 빌드가 PR을 연다).
      # API 대신 git ls-remote: 인증·호출 한도가 필요 없다
      - name: 최신 커밋인지 확인
        id: latest
        run: |
          head="$(git ls-remote "https://github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)"
          if [[ "${head}" != "${SHA}" ]]; then
            echo "앱 repo main이 ${head:0:7}로 앞서 있어 ${SHA:0:7}은 건너뛴다"
            echo "skip=true" >>"${GITHUB_OUTPUT}"
          fi

      - if: steps.latest.outputs.skip != 'true'
        run: bash scripts/bump-tag.sh "${APP}" "${IMAGE}" "${SHA}" "${DIGEST}"

      - name: 태그 PR 열기
        if: steps.latest.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          if git diff --quiet; then
            echo "이미 ${SHA} 태그라 PR을 만들지 않는다"
            exit 0
          fi

          short="${SHA:0:7}"
          branch="bump/${APP}-${short}"
          bot_id="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -am "bump(${APP}): ${short}"
          git push --force origin "${branch}"

          open="$(gh pr list --repo "${HOMELAB}" --head "${branch}" --state open --json number --jq '.[].number')"
          if [[ -z "${open}" ]]; then
            gh pr create --repo "${HOMELAB}" --base main --head "${branch}" \
              --title "bump(${APP}): ${short}" \
              --body "앱 커밋: https://github.com/${SOURCE_REPO}/commit/${SHA}"
          fi

          # 자동 병합 예약. 실제 병합은 ruleset의 필수 검사(tag-pr-guard·static-checks)가
          # 통과해야 GitHub이 한다. 검사가 실패하면 예약된 채로 병합되지 않는다
          gh pr merge "${branch}" --repo "${HOMELAB}" --auto --squash

          # 같은 앱의 이전 태그 PR은 닫는다
          gh pr list --repo "${HOMELAB}" --state open --author "app/${APP_SLUG}" \
            --json number,headRefName --jq '.[] | "\(.number) \(.headRefName)"' |
            while read -r number head; do
              # 접두어가 아니라 정확한 형식으로 (앱 portfolio가 portfolio-api의 PR을 닫지 않게)
              if [[ "${head}" =~ ^bump/${APP}-[0-9a-f]{7}$ && "${head}" != "${branch}" ]]; then
                gh pr close "${number}" --repo "${HOMELAB}" --delete-branch --comment "새 태그 PR로 대체됨"
              fi
            done

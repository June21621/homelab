[project]
name = "tag-pr-guard"
version = "0.1.0"
description = "봇이 연 이미지 태그 PR이 newTag 한 줄만, 검증된 빌드로 바꿨는지 검사한다"
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.3",
]

[project.scripts]
tag-pr-guard = "tag_pr_guard.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv]
# 공개 후 2주가 지나지 않은 패키지 버전은 쓰지 않는다
exclude-newer = "2026-10-28T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

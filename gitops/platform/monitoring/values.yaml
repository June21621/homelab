# kube-prometheus-stack 차트 values (6단계 설계: docs/superpowers/specs/2026-11-16-step6-monitoring-design.md).
# 차트 버전은 gitops/root/monitoring.yaml에 있다. 메모리 값은 시작값이며 설치 후 `kubectl top pods -n monitoring`으로 조정한다.
# CPU는 requests만 두고 limits는 두지 않는다(ArgoCD values와 같은 방식).
#
# 비밀값(Discord 웹훅, healthchecks.io ping URL, Grafana 관리자 비밀번호)은 이 파일에 없다.
# 같은 폴더의 secrets.sops.yaml(KSOPS)이 Secret을 만들고, 여기서는 그 파일 경로·Secret 이름만 참조한다(§3.3).

# --- k3s는 etcd·scheduler·controller-manager·kube-proxy를 k3s server 한 프로세스에 넣어 따로 수집할 주소가 없다 (§3.1) ---
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

# --- 기본 규칙: k3s에 안 맞는 것(오탐)과 단일 노드에 쓸모없는 API SLO만 끈다 (§3.4) ---
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false
    # 다수 사용자용 API 오류 예산 계산. 가장 큰 지표를 여러 시간 창으로 재계산해 무겁다.
    # API 다운은 유지하는 kubernetesSystem의 KubeAPIDown이 잡는다
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeApiserverAvailability: false   # 30일 가용성. 보존이 7일이라 성립하지 않음

windowsMonitoring:
  enabled: false

# --- API 서버·etcd 응답 시간 히스토그램 7종은 수집 단계에서 버린다 (6-4) ---
# 위에서 API SLO 규칙을 꺼도 원본 지표는 계속 쌓인다. 24시간 기준 전체 시계열의 53%(63,444/120,637)였고
# 남긴 규칙 중 이 지표를 쓰는 것은 없다. 대가: Grafana "API server" 대시보드의 지연 시간 그래프가 빈다.
# 차트 기본값은 일부 구간(le)만 버리는데, 이 목록이 그것을 대체한다(이름 기준으로 통째로 버림)
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver_request_duration_seconds|apiserver_request_sli_duration_seconds|apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|etcd_request_duration_seconds)_bucket

# --- kubelet 쪽 중복 사본은 버린다 (6-4c) ---
# k3s는 API 서버·kubelet·etcd가 k3s server 한 프로세스라, kubelet 지표 주소(:10250/metrics)가 apiserver_·etcd_ 지표까지 내보낸다.
# 같은 지표를 apiserver job과 kubelet job에서 두 번 저장하고 있었다(2026-11-18 실측: kubelet job 61,746 중 중복 51,103).
# 원본은 apiserver job에 남는다. API 서버 규칙은 모두 job="apiserver"를 본다
kubelet:
  serviceMonitor:
    metricRelabelings:
      # 차트 기본값(저장소 작업 히스토그램 일부 구간). 여기에 목록을 쓰면 기본값이 대체되므로 그대로 옮겨 둔다
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver|etcd)_.+

# --- Prometheus ---
prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    scrapeInterval: 60s
    evaluationInterval: 60s
    # 우리 ServiceMonitor·PrometheusRule을 Helm release 라벨 없이도 고른다
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }
    # 재시작해도 지표가 남도록 local-path PVC (k3s 기본 StorageClass)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi

# --- Alertmanager ---
alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }
    # secrets.sops.yaml의 Secret을 /etc/alertmanager/secrets/alertmanager-receivers/<키>로 마운트
    secrets:
      - alertmanager-receivers
  # 차트 기본 inhibit_rules(critical이 같은 대상의 warning 억제 등)는 그대로 둔다. 아래 route·receivers만 바꾼다
  config:
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # 감시자 감시: 항상 울리는 Watchdog을 1분마다 healthchecks.io로. 끊기면 healthchecks.io가 이메일 (§3.7)
        # group_interval까지 1m으로 줄여야 실제로 1분마다 나간다
        - receiver: healthchecks
          matchers:
            - alertname = "Watchdog"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
        - receiver: discord
          matchers:
            - severity =~ "warning|critical"
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-receivers/discord-webhook-url
            send_resolved: true
            # 짧은 한국어 형식 (아래 templateFiles). 수집용 라벨(endpoint·instance·uid 등)은 빼고 대상·이유·시각만
            title: '{{ template "homelab.discord.title" . }}'
            message: '{{ template "homelab.discord.message" . }}'
      - name: healthchecks
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-receivers/healthchecks-ping-url
            send_resolved: false
    templates:
      - /etc/alertmanager/config/*.tmpl
  # Discord 알림 문구. 테스트: scripts/test-am-templates.sh(실제 받았던 알림 → 기대 문구, static-checks에서 실행)
  #   제목: 🔥 warning / 🚨 critical / ✅ 해결 · 알림 이름 · 등급 · 건수
  #   본문: 줄마다 문제 대상과 이유 · 한국 시간. 직접 만든 규칙은 summary(대상 포함), 차트 기본 규칙은 영어 summary가
  #         한 줄 일반 문장이라 대상이 담긴 description. 맨 아래에 직접 만든 규칙은 "조치"(description), 기본 규칙은 runbook 링크
  #   한국 시간 = UTC + 9시간(서머타임 없음). tz 함수는 컨테이너의 시간대 데이터에 의존해서 쓰지 않는다
  templateFiles:
    homelab.tmpl: |-
      {{ define "homelab.kst" }}{{ (.Add 32400000000000).Format "15:04" }}{{ end }}
      {{ define "homelab.line" }}{{ if .Annotations.runbook_url }}{{ .Annotations.description }}{{ else }}{{ .Annotations.summary }}{{ end }}{{ end }}
      {{ define "homelab.discord.title" -}}
      {{- if .Alerts.Firing -}}
      {{ if eq .CommonLabels.severity "critical" }}🚨{{ else }}🔥{{ end }} {{ .CommonLabels.alertname }} · {{ .CommonLabels.severity }} · {{ len .Alerts.Firing }}건
      {{- if .Alerts.Resolved }} (해결 {{ len .Alerts.Resolved }}건){{ end }}
      {{- else -}}
      ✅ 해결 · {{ .CommonLabels.alertname }} · {{ len .Alerts.Resolved }}건
      {{- end }}
      {{- end }}
      {{ define "homelab.discord.message" -}}
      {{- range $i, $a := .Alerts.Firing }}{{ if $i }}{{ "\n" }}{{ end }}• {{ template "homelab.line" $a }} · {{ template "homelab.kst" $a.StartsAt }}{{ end }}
      {{- with .Alerts.Firing }}{{ with index . 0 }}
      {{ if .Annotations.runbook_url }}참고: {{ .Annotations.runbook_url }}{{ else if .Annotations.description }}조치: {{ .Annotations.description }}{{ end }}
      {{- end }}{{ end }}
      {{- if and .Alerts.Firing .Alerts.Resolved }}{{ "\n" }}✅ 해결{{ end }}
      {{- range $i, $a := .Alerts.Resolved }}{{ if or $i $.Alerts.Firing }}{{ "\n" }}{{ end }}• {{ template "homelab.line" $a }} · {{ template "homelab.kst" $a.EndsAt }}{{ end }}
      {{- end }}

# --- prometheus-operator ---
prometheusOperator:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }
  # Prometheus·Alertmanager에 붙는 설정 리로더 사이드카
  prometheusConfigReloader:
    resources:
      requests: { cpu: 5m, memory: 16Mi }
      limits: { memory: 32Mi }
  admissionWebhooks:
    deployment:
      resources:
        requests: { cpu: 5m, memory: 16Mi }
        limits: { memory: 32Mi }
    patch:
      resources:
        requests: { cpu: 5m, memory: 16Mi }
        limits: { memory: 32Mi }

# --- kube-state-metrics ---
kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  # k3s ETCDSnapshotFile(클러스터 범위)의 생성 시각을 지표로: 마지막 S3 스냅샷 감시 (§3.5, rules/backup.yaml)
  # KSM v2.20.0은 RFC3339 문자열(status.creationTime)을 유닉스 초로 바꾼다
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: k3s.cattle.io
              version: v1
              kind: ETCDSnapshotFile
            metricNamePrefix: kube_customresource
            labelsFromPath:
              name: [metadata, name]
              location: [spec, location]
            metrics:
              - name: etcdsnapshotfile_created_timestamp_seconds
                help: etcd 스냅샷 생성 시각(유닉스 초)
                each:
                  type: Gauge
                  gauge:
                    path: [status, creationTime]
  # customresourcedefinitions list·watch는 customResourceState를 켜면 차트가 스스로 넣는다
  rbac:
    extraRules:
      - apiGroups: [k3s.cattle.io]
        resources: [etcdsnapshotfiles]
        verbs: [list, watch]

# --- node-exporter ---
prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

# --- Grafana (메모리가 빠듯하면 가장 먼저 뺄 후보, §7) ---
grafana:
  # 차트 기본 대시보드의 시간대. 기본값 utc라 "14:20"을 입력하면 한국 시간 23:20으로 해석됐다(2026-11-18).
  # browser = 접속한 브라우저(한국 시간) 기준
  defaultDashboardsTimezone: browser
  admin:
    existingSecret: grafana-admin   # secrets.sops.yaml. 차트 기본 비밀번호를 쓰지 않는다
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  # 시작값 256Mi / 사이드카 64Mi에서 첫 설치 때 세 컨테이너가 모두 OOMKilled(2026-11-17, 시작 직후 약 250Mi).
  # Grafana 13은 시작할 때 내장 API를 한꺼번에 올려 메모리를 많이 쓴다
  resources:
    requests: { cpu: 25m, memory: 256Mi }
    limits: { memory: 512Mi }
  sidecar:   # 대시보드·데이터소스 ConfigMap을 읽어 Grafana에 넣는 사이드카 2개(Python)
    resources:
      requests: { cpu: 5m, memory: 64Mi }
      limits: { memory: 128Mi }

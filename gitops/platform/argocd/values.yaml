# argo-cd 차트 values. 첫 설치(terraform/argocd-bootstrap)와 이후 자기 관리(gitops/root/argocd.yaml)가
# 이 파일 한 벌을 같이 읽는다. 차트 버전은 gitops/root/argocd.yaml에 있다.
# 메모리 값은 시작값이다. 설치 후 `kubectl top pods -n argocd`로 실측해 조정한다.

# --- 끄는 컴포넌트 (설계 §3.2) ---
dex:
  enabled: false        # SSO 안 씀: admin 계정 하나, 접속은 Tailscale 경유 port-forward로만
notifications:
  enabled: false        # 알림은 6단계 Alertmanager → Discord로 한곳에
applicationSet:
  replicas: 0           # 이 차트 버전엔 끄는 옵션이 없어 파드 0개로 끈다. 8단계 비교 때 다시 켬
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

# --- ArgoCD 설정 ---
configs:
  cm:
    # Kustomize exec 플러그인(KSOPS) 허용
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"

# --- 켜는 컴포넌트 ---
controller:             # Git 상태와 클러스터 상태를 비교·동기화
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
repoServer:             # Git을 받아 Helm·Kustomize로 렌더링
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  copyutil:
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
  # --- KSOPS (5-2): Kustomize가 렌더링할 때 gitops/의 *.sops.yaml을 클러스터 age 키로 푼다 ---
  # init 컨테이너가 ksops 바이너리를 공유 볼륨에 복사 → 본 컨테이너가 /usr/local/bin/ksops로 사용.
  # kustomize는 ArgoCD에 들어 있는 것을 그대로 쓴다(--with-kustomize로 바꾸지 않음)
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "/custom-tools"]
      volumeMounts:
        - { name: custom-tools, mountPath: /custom-tools }
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 64Mi }
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age                # Terraform이 넣은 클러스터 전용 age 키
      secret:
        secretName: sops-age
  volumeMounts:
    - { name: custom-tools, mountPath: /usr/local/bin/ksops, subPath: ksops }
    - { name: sops-age, mountPath: /sops-age, readOnly: true }
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops-age/keys.txt
server:                 # 웹 UI·API (외부 노출 없음)
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
redis:                  # 렌더링 결과 캐시
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
redisSecretInit:        # 설치 때 한 번 도는 redis 비밀번호 생성 Job
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

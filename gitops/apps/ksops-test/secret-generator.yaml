# KSOPS generator: 아래 files의 SOPS 파일을 풀어 Secret으로 만든다.
# Kustomize가 렌더링할 때 exec 플러그인(ksops)을 부르고, ksops는 SOPS_AGE_KEY_FILE의 키로 복호화한다
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: ksops-test-secret
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./test.sops.yaml

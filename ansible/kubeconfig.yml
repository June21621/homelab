# 관리 PC에 kubeconfig를 가져온다 (repo 밖 ~/.kube/homelab.yaml). 실행: make kubeconfig
- name: 관리 PC kubeconfig
  hosts: homelab
  gather_facts: false
  vars:
    kubeconfig_dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/homelab.yaml"
  tasks:
    - name: 미니 PC의 k3s.yaml 읽기
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig
      no_log: true

    - name: 로컬 ~/.kube 디렉터리
      ansible.builtin.file:
        path: "{{ kubeconfig_dest | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    # 127.0.0.1 → Tailscale 주소, 이름 default → homelab
    - name: Kubeconfig 기록
      ansible.builtin.copy:
        content: >-
          {{ k3s_kubeconfig.content | b64decode
             | replace('https://127.0.0.1:6443', 'https://' ~ ansible_host ~ ':6443')
             | regex_replace('(?m)^(\s*(-\s+)?(name|cluster|user|current-context):\s+)default$', '\1homelab') }}
        dest: "{{ kubeconfig_dest }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
      diff: false

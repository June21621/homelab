# etcd를 S3 스냅샷 시점으로 되돌린다. 실행: make etcd-restore SNAPSHOT=<스냅샷 파일명>
# 스냅샷 이후의 클러스터 변경은 모두 사라진다. 새 호스트에서도 같은 토큰(SOPS)으로 복원된다.
# 토큰·S3 설정은 make host가 놓은 /etc/rancher/k3s/config.yaml에서 k3s가 직접 읽는다(명령줄에 비밀값을 두지 않음).
# 새 호스트 순서: make host → make etcd-restore → make kubeconfig(CA가 스냅샷 것으로 바뀜) → make verify-k3s
- name: Etcd S3 스냅샷 복원
  hosts: homelab
  gather_facts: false
  vars:
    snapshot: "{{ lookup('ansible.builtin.env', 'SNAPSHOT') }}"
  tasks:
    - name: 스냅샷 이름 확인
      ansible.builtin.assert:
        that: snapshot | length > 0
        fail_msg: "SNAPSHOT=<파일명>이 필요합니다 (미니 PC에서 sudo k3s etcd-snapshot ls)"

    - name: K3s 설정 파일 확인
      ansible.builtin.stat:
        path: /etc/rancher/k3s/config.yaml
      register: k3s_config

    - name: 설정 파일이 있어야 복원 가능
      ansible.builtin.assert:
        that: k3s_config.stat.exists
        fail_msg: /etc/rancher/k3s/config.yaml이 없습니다. make host를 먼저 실행하세요

    - name: 되돌리기 확인
      ansible.builtin.pause:
        prompt: "클러스터를 {{ snapshot }} 시점으로 되돌립니다. 이후 변경은 사라집니다. 계속하려면 yes"
      register: restore_confirm

    - name: 확인 입력 검사
      ansible.builtin.assert:
        that: restore_confirm.user_input == 'yes'
        fail_msg: 취소했습니다

    - name: K3s 중지
      ansible.builtin.systemd_service:
        name: k3s.service
        state: stopped

    # config.yaml의 etcd-s3: true 때문에 스냅샷을 S3에서 받는다. 비밀값이 명령줄에 없으니
    # 출력을 숨기지 않는다 — 실패하면 원인(스냅샷 이름, S3 권한, 토큰 불일치)이 그대로 보여야 한다
    - name: 스냅샷으로 cluster-reset
      ansible.builtin.command:
        argv: [k3s, server, --cluster-reset, "--cluster-reset-restore-path={{ snapshot }}"]
      changed_when: true

    - name: K3s 시작
      ansible.builtin.systemd_service:
        name: k3s.service
        state: started

    # command 모듈은 따옴표를 벗겨 내므로 jsonpath의 =="Ready"가 깨진다(2026-10-20 리허설에서 발견).
    # 따옴표가 필요 없는 kubectl wait을 쓰고, API가 아직 안 떠 있으면 실패하므로 until로 재시도한다
    - name: 노드 Ready 대기 (최대 5분)
      ansible.builtin.command:
        argv: [k3s, kubectl, wait, --for=condition=Ready, "node/{{ inventory_hostname }}", --timeout=10s]
      register: node_ready
      until: node_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

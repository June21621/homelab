- name: 필수 패키지
  ansible.builtin.apt:
    name: [ufw, unattended-upgrades, ethtool]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: 호스트명
  ansible.builtin.hostname:
    name: "{{ hostname }}"

- name: /etc/hosts에 호스트명 반영
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ hostname }}"

- name: 타임존
  community.general.timezone:
    name: "{{ timezone }}"

# 24시간 서버: 어떤 경로로도 절전에 들어가지 않게 systemd 대상 자체를 막는다
- name: 절전·최대 절전 차단
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop: [sleep.target, suspend.target, hibernate.target, hybrid-sleep.target]

# --- 데스크톱·원격 데스크톱 끄기 (패키지는 남겨 되돌리기 쉽게) ---
- name: 부팅 기본 대상을 터미널 전용으로
  ansible.builtin.file:
    src: /usr/lib/systemd/system/multi-user.target
    dest: /etc/systemd/system/default.target
    state: link

# service_facts는 .socket 유닛을 보여주지 않아 unit 파일 목록으로 설치 여부를 판단한다
# NetworkManager는 Wi-Fi를 먼저 차지해 netplan(networkd)의 Wi-Fi 예비 경로와 충돌한다 (2026-10-05)
- name: 데스크톱·원격 접속·NetworkManager 유닛 중 설치된 것 찾기  # noqa: command-instead-of-module  (설치 여부 조회는 모듈로 불가)
  ansible.builtin.command: >-
    systemctl list-unit-files --no-legend --plain
    lightdm.service xrdp.service xrdp-sesman.service cockpit.socket
    NetworkManager.service NetworkManager-wait-online.service wpa_supplicant.service
  register: base_gui_units
  check_mode: false  # 조회 전용이라 --check에서도 실행
  changed_when: false
  failed_when: false

# static 유닛(예: 비활성화 뒤의 lightdm)은 enable/disable 대상이 아니라 enabled를 주면 매번 changed가 된다.
# lightdm이 부팅 때 뜨지 않는 건 default.target(multi-user) 설정이 보장한다.
- name: 데스크톱·원격 접속 서비스 중지 (설치된 것만)
  ansible.builtin.systemd_service:
    name: "{{ item.split()[0] }}"
    state: stopped
    enabled: "{{ omit if item.split()[1] == 'static' else false }}"
  loop: "{{ base_gui_units.stdout_lines }}"
  loop_control:
    label: "{{ item.split()[0] }}"

# --- 네트워크: 유선 우선 + Wi-Fi 예비 경로 ---
# Wi-Fi 예비 경로(/etc/netplan/60-wifi-fallback.yaml, metric 600)는 비밀번호가 들어 있어
# SOPS 도입(6단계) 전까지 수동 관리한다 (docs/runbook.md). 여기서는 건드리지 않는다.
- name: Cloud-init이 netplan을 다시 만들지 않게 막기
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: "network: {config: disabled}\n"
    mode: "0644"

- name: Cloud-init이 만든 netplan 제거 (Wi-Fi는 60-wifi-fallback.yaml로 대체)
  ansible.builtin.file:
    path: /etc/netplan/50-cloud-init.yaml
    state: absent
  notify: Netplan 적용

- name: 유선 랜 설정 (WoL 포함)
  ansible.builtin.template:
    src: 90-ethernet.yaml.j2
    dest: /etc/netplan/90-ethernet.yaml
    mode: "0600"
  notify: Netplan 적용
